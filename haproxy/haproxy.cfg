global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_front
    bind *:80
    option forwardfor
    default_backend flask_cluster

backend flask_cluster
    balance roundrobin
    cookie SERVERID insert indirect nocache
    option redispatch
    option httpchk GET /health
    http-check expect status 200
    server node1 192.168.56.11:5000 check cookie node1 inter 1000ms fall 2 rise 4
    server node2 192.168.56.12:5000 check cookie node2 inter 1000ms fall 2 rise 4
    server node3 192.168.56.13:5000 check cookie node3 inter 1000ms fall 2 rise 4

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 2s
    stats auth admin:admin123
    stats admin if TRUE
